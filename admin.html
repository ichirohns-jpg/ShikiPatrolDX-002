<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>志木パトロールDX 管理</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef5fb;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color:#17324d;
}

.wrap{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:14px 10px 90px;
}

.title{
  font-size:38px;
  font-weight:900;
  line-height:1.3;
  margin-bottom:20px;
  color:#0b3d66;
}

.card{
  background:#ffffff;
  border-radius:24px;
  padding:18px;
  margin-bottom:24px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}

.kind{
  display:inline-block;
  padding:9px 15px;
  border-radius:999px;
  background:#dfefff;
  color:#005bbb;
  font-size:18px;
  font-weight:900;
  margin-bottom:14px;
}

.date{
  font-size:16px;
  color:#678095;
  margin-bottom:16px;
}

.photo{
  width:100%;
  border-radius:20px;
  margin-bottom:18px;
  display:block;
}

.label{
  font-size:17px;
  font-weight:900;
  color:#0c5f9c;
  margin-top:14px;
  margin-bottom:8px;
}

.text{
  font-size:20px;
  line-height:1.75;
  margin-bottom:12px;
}

textarea{
  width:100%;
  min-height:140px;
  border:none;
  border-radius:18px;
  background:#f5f9fd;
  padding:16px;
  font-size:20px;
  line-height:1.7;
  resize:vertical;
  margin-bottom:14px;
}

input{
  width:100%;
  border:none;
  border-radius:16px;
  background:#f5f9fd;
  padding:16px;
  font-size:20px;
  margin-bottom:14px;
}

select{
  width:100%;
  border:none;
  border-radius:16px;
  background:#f5f9fd;
  padding:16px;
  font-size:20px;
  margin-bottom:14px;
}

.save-btn{
  width:100%;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#0a84ff,#005bbb);
  color:#fff;
  font-size:26px;
  font-weight:900;
  padding:20px;
}

.ok{
  margin-top:12px;
  color:#147a28;
  font-size:18px;
  font-weight:900;
}

.loading{
  text-align:center;
  font-size:28px;
  color:#678095;
  padding:60px 20px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="title">
志木パトロールDX<br>
管理画面
</div>

<div id="list">
<div class="loading">読み込み中...</div>
</div>

</div>

<script>
const GAS_URL =
"https://script.google.com/macros/s/AKfycbwQZtUMg-4Absy7PQE0bslw7C62L7x7cFnePCtUhRIx1nbgRBctE85zRy37vs6RKCey/exec";

function loadData(){
  const script = document.createElement('script');
  script.src = GAS_URL + '?callback=handlePatrolData&_=' + Date.now();
  document.body.appendChild(script);
}

window.handlePatrolData = function(res){

  if(!res || !res.ok){
    document.getElementById('list').innerHTML =
      '<div class="card">データ取得失敗</div>';
    return;
  }

  let html = '';

  res.data.forEach(function(item){

    html += `
      <div class="card">

        <div class="kind">${escapeHtml(item.kind || '')}</div>

        <div class="date">${escapeHtml(item.date || '')}</div>

        ${
          item.photoUrl
          ? `<img src="${escapeAttr(item.photoUrl)}" class="photo">`
          : ''
        }

        <div class="label">内容</div>

        <div class="text">
          ${escapeHtml(item.detail || '')}
        </div>

        <div class="label">対応ステータス</div>

        <select>
          <option ${item.status==='未対応'?'selected':''}>未対応</option>
          <option ${item.status==='確認中'?'selected':''}>確認中</option>
          <option ${item.status==='対応中'?'selected':''}>対応中</option>
          <option ${item.status==='対応済み'?'selected':''}>対応済み</option>
        </select>

        <div class="label">管理者メッセージ</div>

        <textarea placeholder="管理者メッセージを書いてください">${escapeHtml(item.adminMessage || '')}</textarea>

        <div class="label">改善内容</div>

        <textarea placeholder="改善内容">${escapeHtml(item.improvement || '')}</textarea>

        <div class="label">改善後写真URL</div>

        <input
          type="text"
          value="${escapeAttr(item.afterPhoto || '')}"
          placeholder="改善後写真URL">

        <div class="label">対応日</div>

        <input
          type="text"
          value="${escapeAttr(item.responseDate || '')}"
          placeholder="2026/05/12">

        <button class="save-btn">
          保存する
        </button>

        <div class="ok">
          ※ 現在は表示テスト中
        </div>

      </div>
    `;
  });

  document.getElementById('list').innerHTML = html;
};

function escapeHtml(str){
  return String(str || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function escapeAttr(str){
  return escapeHtml(str).replace(/"/g,'&quot;');
}

loadData();
</script>

</body>
</html>
