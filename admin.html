<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>志木パトロールDX 管理画面</title>

<style>
body{
  margin:0;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  background:#eef5fb;
  color:#17324d;
}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:28px 16px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:26px 20px;
  box-shadow:0 8px 24px rgba(20,70,120,.18);
}

h1{
  font-size:30px;
  line-height:1.4;
  margin:0 0 16px;
  color:#0b3d66;
}

p{
  font-size:18px;
  line-height:1.8;
}

input{
  width:100%;
  font-size:24px;
  padding:16px;
  border-radius:16px;
  border:2px solid #d3e3f1;
  margin-top:16px;
}

button{
  width:100%;
  margin-top:20px;
  padding:18px;
  border:none;
  border-radius:18px;
  background:#0a84ff;
  color:#fff;
  font-size:24px;
  font-weight:900;
}

#error{
  display:none;
  margin-top:18px;
  color:#c40000;
  font-weight:900;
  font-size:18px;
}

#ok{
  display:none;
  margin-top:22px;
  background:#f6fbff;
  border-radius:18px;
  padding:18px;
  font-size:18px;
  line-height:1.8;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>
      志木パトロールDX<br>
      管理画面
    </h1>

    <p>
      管理用キーワードを入力してください。
    </p>

    <input
      id="pw"
      type="password"
      placeholder="キーワード">

    <button onclick="login()">
      管理画面を開く
    </button>

    <div id="error">
      キーワードが違います。
    </div>

    <div id="ok">
      管理画面に入りました。<br>
      次に、対応状況や改善内容を入力できるようにしていきます。
    </div>

  </div>
</div>

<script>
const PASSWORD = "shiki2026";

function login(){

  const value =
    document.getElementById("pw").value;

  if(value === PASSWORD){

    document.getElementById("error").style.display = "none";

    document.getElementById("ok").style.display = "block";

  }else{

    document.getElementById("error").style.display = "block";

    document.getElementById("ok").style.display = "none";

  }

}
</script>

</body>
</html>
