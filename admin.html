<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>志木パトロールDX 管理画面</title>

<style>
body{
  margin:0;
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  background:#eef5fb;
  color:#17324d;
}

.wrap{
  max-width:520px;
  margin:0 auto;
  padding:28px 16px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:26px 20px;
  box-shadow:0 8px 24px rgba(20,70,120,.18);
}

h1{
  font-size:28px;
  margin:0 0 14px;
  color:#0b3d66;
}

p{
  font-size:17px;
  line-height:1.7;
}

input{
  width:100%;
  font-size:22px;
  padding:16px;
  border-radius:14px;
  border:2px solid #cfe0ef;
  margin-top:14px;
}

button{
  width:100%;
  margin-top:18px;
  padding:17px;
  border:none;
  border-radius:16px;
  background:#0a84ff;
  color:#fff;
  font-size:22px;
  font-weight:900;
}

#error{
  color:#c20000;
  font-weight:800;
  margin-top:14px;
  display:none;
}

#admin{
  display:none;
  margin-top:22px;
  background:#f6fbff;
  border-radius:18px;
  padding:18px;
  font-size:18px;
  line-height:1.8;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>志木パトロールDX<br>管理画面</h1>

    <p>
      管理用キーワードを入力してください。
    </p>

    <input id="key" type="password" placeholder="キーワード">

    <button onclick="login()">管理画面を開く</button>

    <div id="error">キーワードが違います。</div>

    <div id="admin">
      <strong>管理画面に入りました。</strong><br>
      次にここへ、投稿一覧・対応状況・改善内容・改善後写真を入れていきます。
    </div>
  </div>
</div>

<script>
const ADMIN_KEY = "shiki2026";

function login(){
  const key = document.getElementById("key").value;

  if(key === ADMIN_KEY){
    document.getElementById("error").style.display = "none";
    document.getElementById("admin").style.display = "block";
  }else{
    document.getElementById("error").style.display = "block";
    document.getElementById("admin").style.display = "none";
  }
}
</script>
</body>
</html>
